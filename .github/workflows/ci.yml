name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  security-scan:
    name: Security Scan (Advisory)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies and audit tools
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit bandit

      - name: Run pip-audit (Python dependencies)
        working-directory: ./backend
        run: |
          pip-audit -r requirements.txt --format=json --output=pip-audit-report.json || true
        continue-on-error: true

      - name: Run bandit security linter
        working-directory: ./backend
        run: |
          bandit -r . -ll -ii -x ./tests,./scripts --format json -o bandit-report.json || true
        continue-on-error: true

      - name: Upload security scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-results
          path: |
            backend/pip-audit-report.json
            backend/bandit-report.json

  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies and quality tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

  backend-test:
    name: Backend Tests
    needs: backend-quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: insightflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for Postgres to be available
        env:
          PGPASSWORD: password
          PGUSER: user
        run: |
          if ! command -v psql &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi

          for i in $(seq 1 40); do
            if psql -h localhost -U user -d insightflow_test -c '\q' 2>/dev/null; then
              echo "✓ Postgres is ready"
              exit 0
            fi
            echo "Waiting for Postgres ($i/40)..."
            sleep 1
          done
          echo "✗ Postgres did not become ready in time"
          exit 1

      - name: Initialize test database
        env:
          SECRET_KEY: "test_secret_key_for_ci_pipeline_only"
          DATABASE_URL: "postgresql+asyncpg://user:password@localhost:5432/insightflow_test"
        run: python scripts/init_db_for_ci.py

      - name: Run tests with coverage
        env:
          SECRET_KEY: "test_secret_key_for_ci_pipeline_only"
          DATABASE_URL: "postgresql+asyncpg://user:password@localhost:5432/insightflow_test"
          REDIS_URL: "redis://localhost:6379/0"
          ALGORITHM: "HS256"
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
          REFRESH_TOKEN_EXPIRE_DAYS: "7"
          GOOGLE_CLIENT_ID: "mock-google-client-id"
          GOOGLE_CLIENT_SECRET: "mock-google-client-secret"
          GOOGLE_REDIRECT_URI: "http://localhost:8000/auth/callback/google"
          TESTING: "true"
        run: |
          python -m pytest --cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=85 -W ignore::RuntimeWarning

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: |
            backend/.coverage
            backend/coverage.xml

  frontend-check:
    name: Frontend Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Lint
        run: npm run lint:check

      - name: Type Check
        run: npm run type-check

      - name: Run Unit Tests
        env:
          CI: true
        run: npm run test:coverage

      - name: Build
        env:
          CI: true
          API_URL: "http://127.0.0.1:8000"
          NEXT_PUBLIC_API_URL: "http://127.0.0.1:8000"
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next
          retention-days: 1

  e2e-tests:
    name: E2E Tests
    needs: [backend-test, frontend-check]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: ./frontend
        run: npm run test:e2e -- --project=chromium
        env:
          CI: true
          BASE_URL: "http://127.0.0.1:3000"
          API_URL: "http://127.0.0.1:8000"
          GOOGLE_CLIENT_ID: "mock-google-client-id"
          GOOGLE_CLIENT_SECRET: "mock-google-client-secret"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
