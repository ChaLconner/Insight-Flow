name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ============================================
  # SECURITY SCANNING (Staff/Principal Level)
  # ============================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install safety for vulnerability scanning
        run: pip install safety bandit

      - name: Run safety check (Python dependencies)
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          safety check --full-report || echo "::warning::Some vulnerabilities detected"
        continue-on-error: true

      - name: Run pip-audit (Python dependencies)
        working-directory: ./backend
        run: |
          pip install pip-audit
          pip-audit || echo "::warning::pip-audit found vulnerabilities"
        continue-on-error: true

      - name: Run bandit security linter
        working-directory: ./backend
        run: |
          bandit -r . -ll -ii -x ./tests,./scripts --format json -o bandit-report.json || true
          cat bandit-report.json
        continue-on-error: true

      - name: Upload security scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-results
          path: backend/bandit-report.json

  # ============================================
  # BACKEND TESTS
  # ============================================
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: insightflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx coverage argon2-cffi

      - name: Wait for Postgres to be available
        env:
          PGPASSWORD: password
          PGUSER: user
        run: |
          if ! command -v psql &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi

          for i in $(seq 1 40); do
            if psql -h localhost -U user -d insightflow_test -c '\q' 2>/dev/null; then
              echo "✓ Postgres is ready"
              exit 0
            fi
            echo "Waiting for Postgres ($i/40)..."
            sleep 1
          done
          echo "✗ Postgres did not become ready in time"
          exit 1

      - name: Initialize test database
        env:
          SECRET_KEY: "test_secret_key_for_ci_pipeline_only"
          DATABASE_URL: "postgresql+asyncpg://user:password@localhost:5432/insightflow_test"
        run: python scripts/init_db_for_ci.py

      - name: Run Tests with Coverage
        env:
          SECRET_KEY: "test_secret_key_for_ci_pipeline_only"
          DATABASE_URL: "postgresql+asyncpg://user:password@localhost:5432/insightflow_test"
          REDIS_URL: "redis://localhost:6379/0"
          ALGORITHM: "HS256"
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
          REFRESH_TOKEN_EXPIRE_DAYS: "7"
          GOOGLE_CLIENT_ID: "mock-google-client-id"
          GOOGLE_CLIENT_SECRET: "mock-google-client-secret"
          GOOGLE_REDIRECT_URI: "http://localhost:8000/auth/callback/google"
          TESTING: "true"
        run: |
          coverage run -m pytest -v -W ignore::RuntimeWarning
          coverage report --fail-under=85
          coverage xml -o coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: |
            backend/.coverage
            backend/coverage.xml

  # ============================================
  # FRONTEND CHECKS
  # ============================================
  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high || echo "::warning::npm audit found high severity vulnerabilities"
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit

      - name: Run Unit Tests
        run: npm run test -- --run --coverage

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "https://api.example.com"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next
          retention-days: 1

  # ============================================
  # E2E TESTS (Playwright)
  # ============================================
  e2e-tests:
    name: E2E Tests
    needs: [backend-test, frontend-check]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: ./frontend
        run: npx playwright test --project=chromium
        env:
          CI: true
          GOOGLE_CLIENT_ID: "mock-google-client-id"
          GOOGLE_CLIENT_SECRET: "mock-google-client-secret"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  # ============================================
  # DEPLOY STAGING (on push to dev)
  # ============================================
  deploy-staging:
    name: Deploy to Staging
    needs: [backend-test, frontend-check, security-scan]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Backend to Render (Staging)
        run: |
          echo "🚀 Deploying Backend to Staging..."
          # Render auto-deploys from dev branch
          echo "Waiting for Render deployment..."

      - name: Deploy Frontend to Vercel (Preview)
        run: |
          echo "🚀 Deploying Frontend to Vercel Preview..."
          # Vercel auto-deploys previews for branches

      - name: Notify staging deployment
        run: |
          echo "✅ Staging deployment triggered"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"

  # ============================================
  # DEPLOY PRODUCTION (on push to main)
  # ============================================
  deploy-production:
    name: Deploy to Production
    needs: [backend-test, frontend-check, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Backend to Render (Production)
        run: |
          echo "🚀 Deploying Backend to Production..."
          # Render auto-deploys from main branch
          echo "Waiting for Render deployment..."

      - name: Deploy Frontend to Vercel (Production)
        run: |
          echo "🚀 Deploying Frontend to Vercel Production..."
          # Vercel auto-deploys production for main branch

      - name: Run post-deployment health check
        run: |
          echo "Running health checks..."
          # Add actual health check commands here
          # curl -f https://api.your-domain.com/health || exit 1

      - name: Notify production deployment
        if: success()
        run: |
          echo "✅ Production deployment successful!"
          echo "Deployed commit: ${{ github.sha }}"
