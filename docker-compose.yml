version: "3.8"

# ===========================================
# IMPORTANT: Copy .env.docker.example to .env.docker
# and configure your environment variables before running.
# NEVER commit .env.docker to version control!
# ===========================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      # Override or add environment-specific values
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-insightflow}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-insightflow}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - insight-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    env_file:
      - .env.docker
    depends_on:
      - backend
    networks:
      - insight-network

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-insightflow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-insightflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-insightflow} -d ${POSTGRES_DB:-insightflow}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - insight-network

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - insight-network

networks:
  insight-network:
    driver: bridge

volumes:
  postgres_data:
